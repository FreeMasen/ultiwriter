[package]
name = "ultiwriter"
version = "0.1.1"
edition = "2024"
description = "Client for the Vikant Ultimate Box embroidery card reader/writer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FreeMasen/ultiwriter.git"
publish = true

[features]
default = ["usb"]
# Direct USB access to the box's FTDI bridge via nusb (pure Rust).
usb = ["dep:nusb"]

[dependencies]
nusb = { version = "0.2.9", optional = true }

[[bin]]
name = "uw"
required-features = ["usb"]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
